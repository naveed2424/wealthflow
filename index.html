    <script>
      // Defensive initialization: ensure window.fetch has both a getter and setter
      // so browser extensions (requests interceptors) don't throw TypeError: Cannot set property fetch
      (function() {
        try {
          var currentFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return currentFetch; },
            set: function(fn) { currentFetch = fn; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}

        // Suppress external extension injection errors from bubbling
        window.addEventListener('error', function(e) {
          if (e && (
            (e.filename && e.filename.indexOf('chrome-extension://') !== -1) ||
            (e.message && e.message.indexOf('Cannot set property fetch') !== -1)
          )) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
